<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепты</title>
</head>
<body>
<p><strong>Блюдо: <u>{{ name }}</u></strong></p>
<p><strong>Количество персон: {{ servings }}</strong></p>
{% for ingredient, amount in recipe.items %}
    <p>{{ ingredient.upper }}: {{ amount }} </p>
{% empty %}
    <p>Такого рецепта не знаю :(</p>
{% endfor %}
</body>
</html>
